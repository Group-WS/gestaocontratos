# CI do Confere.
#
# Roda em todo push e em todo PR. Dois trabalhos, independentes:
#
#   app    os testes do projeto (npm test) e o build do front — inclusive o
#          que sobe o backend e confere que nenhuma rota responde sem login
#   e2e    no navegador: sem sessao, o app para na tela de entrada; publicado
#          sem configuracao, ninguem entra
#
# Os testes de policy (RLS) e o gate de qualidade rodam no outro workflow,
# quality-gate.yml, que e' o do padrao Group WS.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# O design system (@group-ws/ws-ui) e' pacote privado do GitHub Packages.
# Sem autenticacao o `npm ci` do web para em 401. O token vem do segredo
# GH_PACKAGES_TOKEN (PAT com read:packages na org Group-WS); sem ele, tenta o
# GITHUB_TOKEN do proprio workflow, que so' funciona se o pacote der acesso
# de leitura a este repositorio (Package settings > Manage Actions access).
permissions:
  contents: read
  packages: read

jobs:
  app:
    name: Testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@group-ws"

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      # Dependência de produção com vulnerabilidade alta ou crítica não
      # entra (SEG-40). O que roda só no build/dev fica de fora do corte.
      - name: Vulnerabilidades (produção)
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build

  e2e:
    name: Ponta a ponta (navegador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@group-ws"

      - name: Dependencias do app
        run: npm ci
        working-directory: web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Dependencias do e2e
        run: npm ci
        working-directory: e2e

      - name: Navegador
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Testes
        run: npx playwright test
        working-directory: e2e

      - name: Rastro das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rastro
          path: e2e/test-results/
          retention-days: 7
